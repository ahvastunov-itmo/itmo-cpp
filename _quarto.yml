project:
  type: website
  output-dir: _site
  pre-render:
    - node scripts/update-godbolt-links.mjs
    - node scripts/update-name-benchmark.mjs
    - node scripts/update-quick-bench-links.mjs
  render:
    - "*.md"
    - "lectures/*.md"
    - "articles/*.md"
    - "videos/*.md"
    - "quizzes/*.md"
    - "!README.md"
    - "!AGENTS.md"
    - "!template.md"
    - "!lecture-content-review.md"
  resources:
    - assets/

lang: ru

website:
  title: "Основы программирования на C++"
  description: "Конспекты курса по языкам C и C++"
  favicon: assets/favicon.svg
  site-url: "https://ahvastunov-itmo.github.io/itmo-cpp/"
  repo-url: "https://github.com/ahvastunov-itmo/itmo-cpp"
  repo-actions: [edit, source, issue]
  page-navigation: true
  reader-mode: true
  open-graph: true
  navbar:
    title: "Основы программирования на C++"
    left:
      - href: index.md
        text: Главная
      - href: lectures/00-introduction.md
        text: Лекции
      - href: articles/01-setup.md
        text: Статьи
      - href: videos/index.md
        text: Видео
      - href: quizzes/index.md
        text: Квизы
      - href: schedule.md
        text: Расписание
    tools:
      - icon: github
        href: "https://github.com/ahvastunov-itmo/itmo-cpp"
        text: GitHub
  # Лекции, статьи, видео и квизы живут в разных боковых панелях: стрелки
  # «предыдущая / следующая» ходят только внутри своей панели.
